name: Verify Project Seed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Project Seed
        uses: actions/checkout@v4
      - name: Test verifier failure detection
        run: python3 -m unittest discover -s tests -v
      - name: Verify bundle and propagation manifest
        run: python3 scripts/verify_seed_bundle.py
